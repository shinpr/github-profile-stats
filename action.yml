name: GitHub Profile Stats
description: Generate validated static GitHub profile graphics.
inputs:
  username:
    description: GitHub login to summarize.
    required: true
  token:
    description: Workflow-provided github.token.
    required: true
  profile:
    description: Registered visual profile and its required metrics.
    required: false
    default: signal-field
outputs:
  ready-dir:
    description: Absolute path containing the complete validated artifact set.
runs:
  using: node24
  main: src/action.mjs
