name: GitHub Profile Stats
description: Generate wide and compact Signal Field profile graphics.
inputs:
  username:
    description: GitHub login to summarize.
    required: true
  token:
    description: Workflow-provided github.token.
    required: true
  theme:
    description: Registered visual theme. Every theme emits wide/compact in light/dark.
    required: false
    default: signal-field
outputs:
  ready-dir:
    description: Absolute path containing the complete validated four-SVG set.
runs:
  using: node24
  main: src/action.mjs
